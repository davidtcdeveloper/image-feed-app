name: iosApp
options:
  bundleIdPrefix: com.example.imagefeed
  developmentLanguage: en
  knownRegions:
    - en
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    scheme:
      testTargets:
        - iosAppTests
        - iosAppUITests
    sources:
      - iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.iosApp
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin Shared Framework
        alwaysRun: true
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            USER_JDK=$(find "$HOME/Library/Java/JavaVirtualMachines" -maxdepth 4 -name "Home" 2>/dev/null | head -n 1)
            if [ -n "$USER_JDK" ] && [ -d "$USER_JDK" ]; then
              export JAVA_HOME="$USER_JDK"
            elif [ -x "/usr/libexec/java_home" ]; then
              export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null || true)"
            fi
          fi
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            for BREW_JDK in "/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home" "/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home" "/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home"; do
              if [ -d "$BREW_JDK" ]; then
                export JAVA_HOME="$BREW_JDK"
                break
              fi
            done
          fi
          if [ -n "$JAVA_HOME" ]; then
            export PATH="$JAVA_HOME/bin:$PATH:/opt/homebrew/bin:/usr/local/bin"
          fi
          if [ -z "$KOTLIN_BUILD_INVOKED" ]; then
            export KOTLIN_BUILD_INVOKED=1
            "$SRCROOT/../gradlew" -p "$SRCROOT/.." :shared:embedAndSignAppleFrameworkForXcode
          fi
        shell: /bin/sh

  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - iosAppTests
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.iosAppTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosApp.app/iosApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  macosAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - iosAppTests
    dependencies:
      - target: macosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.macosAppTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/macosApp.app/Contents/MacOS/macosApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_APP_SANDBOX: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64

  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.iosAppUITests
        TEST_TARGET_NAME: iosApp
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  macosApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    scheme:
      testTargets:
        - macosAppTests
    sources:
      - iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.macosApp
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
        DEAD_CODE_STRIPPING: YES
    preBuildScripts:
      - name: Compile Kotlin Shared Framework
        alwaysRun: true
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            USER_JDK=$(find "$HOME/Library/Java/JavaVirtualMachines" -maxdepth 4 -name "Home" 2>/dev/null | head -n 1)
            if [ -n "$USER_JDK" ] && [ -d "$USER_JDK" ]; then
              export JAVA_HOME="$USER_JDK"
            elif [ -x "/usr/libexec/java_home" ]; then
              export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null || true)"
            fi
          fi
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            for BREW_JDK in "/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home" "/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home" "/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home"; do
              if [ -d "$BREW_JDK" ]; then
                export JAVA_HOME="$BREW_JDK"
                break
              fi
            done
          fi
          if [ -n "$JAVA_HOME" ]; then
            export PATH="$JAVA_HOME/bin:$PATH:/opt/homebrew/bin:/usr/local/bin"
          fi
          if [ -z "$KOTLIN_BUILD_INVOKED" ]; then
            export KOTLIN_BUILD_INVOKED=1
            "$SRCROOT/../gradlew" -p "$SRCROOT/.." :shared:embedAndSignAppleFrameworkForXcode
          fi
        shell: /bin/sh

  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - iosAppTests
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.iosAppTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosApp.app/iosApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  macosAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - iosAppTests
    dependencies:
      - target: macosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.macosAppTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/macosApp.app/Contents/MacOS/macosApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_APP_SANDBOX: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64

  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.iosAppUITests
        TEST_TARGET_NAME: iosApp
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
