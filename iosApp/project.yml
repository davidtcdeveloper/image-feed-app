name: iosApp
options:
  bundleIdPrefix: com.example.imagefeed
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.iosApp
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin Shared Framework
        alwaysRun: true
        script: |
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            USER_JDK=$(find "$HOME/Library/Java/JavaVirtualMachines" -maxdepth 2 -name "Home" 2>/dev/null | head -n 1)
            if [ -n "$USER_JDK" ] && [ -d "$USER_JDK" ]; then
              export JAVA_HOME="$USER_JDK"
            elif [ -x "/usr/libexec/java_home" ]; then
              export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null || true)"
            fi
          fi
          if [ -n "$JAVA_HOME" ]; then
            export PATH="$JAVA_HOME/bin:$PATH:/opt/homebrew/bin:/usr/local/bin"
          fi
          if [ -z "$KOTLIN_BUILD_INVOKED" ]; then
            export KOTLIN_BUILD_INVOKED=1
            "$SRCROOT/../gradlew" -p "$SRCROOT/.." :shared:embedAndSignAppleFrameworkForXcode
          fi
        shell: /bin/sh

  macosApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.macosApp
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin Shared Framework
        alwaysRun: true
        script: |
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            USER_JDK=$(find "$HOME/Library/Java/JavaVirtualMachines" -maxdepth 2 -name "Home" 2>/dev/null | head -n 1)
            if [ -n "$USER_JDK" ] && [ -d "$USER_JDK" ]; then
              export JAVA_HOME="$USER_JDK"
            elif [ -x "/usr/libexec/java_home" ]; then
              export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null || true)"
            fi
          fi
          if [ -n "$JAVA_HOME" ]; then
            export PATH="$JAVA_HOME/bin:$PATH:/opt/homebrew/bin:/usr/local/bin"
          fi
          if [ -z "$KOTLIN_BUILD_INVOKED" ]; then
            export KOTLIN_BUILD_INVOKED=1
            "$SRCROOT/../gradlew" -p "$SRCROOT/.." :shared:embedAndSignAppleFrameworkForXcode
          fi
        shell: /bin/sh
