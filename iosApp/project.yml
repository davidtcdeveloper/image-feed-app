name: iosApp
options:
  bundleIdPrefix: com.example.imagefeed
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.iosApp
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin Shared Framework
        alwaysRun: true
        script: |
          if [ -z "$KOTLIN_BUILD_INVOKED" ]; then
            export KOTLIN_BUILD_INVOKED=1
            "$SRCROOT/../gradlew" -p "$SRCROOT/.." :shared:embedAndSignAppleFrameworkForXcode
          fi
        shell: /bin/sh

  macosApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagefeed.macosApp
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin Shared Framework
        alwaysRun: true
        script: |
          if [ -z "$KOTLIN_BUILD_INVOKED" ]; then
            export KOTLIN_BUILD_INVOKED=1
            "$SRCROOT/../gradlew" -p "$SRCROOT/.." :shared:embedAndSignAppleFrameworkForXcode
          fi
        shell: /bin/sh
